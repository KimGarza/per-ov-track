AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
Resources:
  LambdaGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda application network access
      VpcId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-VpcId'}
      Tags: [{Key: Name, Value: !Sub 'crimrhyth-${env}-lambda-sg'}]
  DatabaseGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database restricted to Lambda
      VpcId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-VpcId'}
      Tags: [{Key: Name, Value: !Sub 'crimrhyth-${env}-db-sg'}]
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseGroup, SourceSecurityGroupId: !Ref LambdaGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432}
Outputs:
  LambdaGroupId:
    Value: !Ref LambdaGroup
    Export: {Name: !Sub 'crimrhyth-${env}-LambdaGroupId'}
  DatabaseGroupId:
    Value: !Ref DatabaseGroup
    Export: {Name: !Sub 'crimrhyth-${env}-DatabaseGroupId'}
