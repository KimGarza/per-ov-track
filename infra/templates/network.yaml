AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
  VpcCidr: {Type: String}
  SubnetACidr: {Type: String}
  SubnetBCidr: {Type: String}
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub 'crimrhyth-${env}-vpc'}]
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub 'crimrhyth-${env}-private-a'}]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub 'crimrhyth-${env}-private-b'}]
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: {Name: !Sub 'crimrhyth-${env}-VpcId'}
  SubnetAId:
    Value: !Ref SubnetA
    Export: {Name: !Sub 'crimrhyth-${env}-SubnetAId'}
  SubnetBId:
    Value: !Ref SubnetB
    Export: {Name: !Sub 'crimrhyth-${env}-SubnetBId'}
