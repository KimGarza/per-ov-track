AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
  CognitoExportPrefix:
    Type: String
    Default: ''
Conditions:
  HasCognitoExports: !Not [!Equals [!Ref CognitoExportPrefix, '']]
Resources:
  GoogleLoginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'crimrhyth/${env}/google'
      Description: Google login credentials; client_id and client_secret added outside source control.
      # No SecretString or GenerateSecretString creates a genuinely empty shell.

  AppleLoginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'crimrhyth/${env}/apple'
      Description: Apple login credentials; client_id, team_id, key_id and private_key added outside source control.

  CognitoConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'crimrhyth/${env}/cognito'
      Description: Generated Cognito configuration, not a mobile client secret; empty until exports are connected.
      SecretString: !If
        - HasCognitoExports
        - !Sub
          - '{"region":"${AWS::Region}","user_pool_id":"${PoolId}","client_id":"${ClientId}"}'
          - PoolId:
              Fn::ImportValue: !Sub '${CognitoExportPrefix}-UserPoolId'
            ClientId:
              Fn::ImportValue: !Sub '${CognitoExportPrefix}-UserPoolClientId'
        - !Ref AWS::NoValue

  DatabaseSecret:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'crimrhyth/${env}/database'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"appuser"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
Outputs:
  GoogleLoginSecretArn:
    Value: !Ref GoogleLoginSecret
    Export: {Name: !Sub 'crimrhyth-${env}-GoogleLoginSecretArn'}
  AppleLoginSecretArn:
    Value: !Ref AppleLoginSecret
    Export: {Name: !Sub 'crimrhyth-${env}-AppleLoginSecretArn'}
  CognitoConfigSecretArn:
    Value: !Ref CognitoConfigSecret
    Export: {Name: !Sub 'crimrhyth-${env}-CognitoConfigSecretArn'}
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export: {Name: !Sub 'crimrhyth-${env}-DatabaseSecretArn'}
