AWSTemplateFormatVersion: '2010-09-09'
Description: Per-ov-track secret shells and optional generated Cognito configuration.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stage, prod]
  AppName:
    Type: String
    Default: per-ov-track
    AllowedPattern: '[a-z][a-z0-9-]*'
  CognitoExportPrefix:
    Type: String
    Default: ''
    AllowedPattern: '([A-Za-z][A-Za-z0-9-]*)?'
    Description: Leave blank until Cognito exports exist; then set the Cognito stack export prefix.

Conditions:
  HasCognitoExports: !Not [!Equals [!Ref CognitoExportPrefix, '']]

Resources:
  GoogleLoginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${Environment}/${AppName}/google'
      Description: Google login credentials; client_id and client_secret added outside source control.
      # No SecretString or GenerateSecretString creates a genuinely empty shell.

  AppleLoginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${Environment}/${AppName}/apple'
      Description: Apple login credentials; client_id, team_id, key_id and private_key added outside source control.

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${Environment}/${AppName}/database'
      Description: Database connection configuration and credentials; populated after database design.

  CognitoConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${Environment}/${AppName}/cognito'
      Description: Generated Cognito configuration, not a mobile client secret; empty until exports are connected.
      SecretString: !If
        - HasCognitoExports
        - !Sub
          - '{"region":"${AWS::Region}","user_pool_id":"${PoolId}","client_id":"${ClientId}"}'
          - PoolId:
              Fn::ImportValue: !Sub '${CognitoExportPrefix}-UserPoolId'
            ClientId:
              Fn::ImportValue: !Sub '${CognitoExportPrefix}-UserPoolClientId'
        - !Ref AWS::NoValue

Outputs:
  GoogleLoginSecretArn:
    Value: !Ref GoogleLoginSecret
    Export:
      Name: !Sub '${Environment}-${AppName}-GoogleLoginSecretArn'
  AppleLoginSecretArn:
    Value: !Ref AppleLoginSecret
    Export:
      Name: !Sub '${Environment}-${AppName}-AppleLoginSecretArn'
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${Environment}-${AppName}-DatabaseSecretArn'
  CognitoConfigSecretArn:
    Value: !Ref CognitoConfigSecret
    Export:
      Name: !Sub '${Environment}-${AppName}-CognitoConfigSecretArn'
