AWSTemplateFormatVersion: '2010-09-09'
Description: Private Secrets Manager connectivity for VPC-attached Lambda. Interface endpoint incurs hourly and data charges.
Parameters:
  env: {Type: String, AllowedValues: [dev, stage, prod]}
Resources:
  EndpointGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from Crimson Rhythm Lambda to Secrets Manager endpoint
      VpcId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-VpcId'}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-LambdaGroupId'}
  SecretsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-VpcId'}
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue {Fn::Sub: 'crimrhyth-${env}-SubnetAId'}
        - !ImportValue {Fn::Sub: 'crimrhyth-${env}-SubnetBId'}
      SecurityGroupIds: [!Ref EndpointGroup]
Outputs:
  EndpointId:
    Value: !Ref SecretsEndpoint
    Export: {Name: !Sub 'crimrhyth-${env}-SecretsEndpointId'}
