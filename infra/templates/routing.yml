AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: !Sub 'crimrhyth-${env}-api', ProtocolType: HTTP}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue {Fn::Sub: 'crimrhyth-${env}-ApiFunctionArn'}
      PayloadFormatVersion: '2.0'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: {ApiId: !Ref HttpApi, StageName: !Ref env, AutoDeploy: true}
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: !Sub 'crimrhyth-${env}-cognito-jwt'
      JwtConfiguration:
        Audience:
          - !ImportValue {Fn::Sub: 'crimrhyth-${env}-UserPoolClientId'}
        Issuer: !Sub
          - 'https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}'
          - PoolId: !ImportValue {Fn::Sub: 'crimrhyth-${env}-UserPoolId'}
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub 'integrations/${Integration}'
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /health'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${Integration}'
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      FunctionName: !ImportValue {Fn::Sub: 'crimrhyth-${env}-ApiFunctionArn'}
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${env}'
    Export: {Name: !Sub 'crimrhyth-${env}-ApiUrl'}
