AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: !Sub 'crimrhyth-${env}-api', ProtocolType: HTTP}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue {Fn::Sub: 'crimrhyth-${env}-ApiFunctionArn'}
      PayloadFormatVersion: '2.0'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: {ApiId: !Ref HttpApi, StageName: !Ref env, AutoDeploy: true}
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /{proxy+}'
      Target: !Sub 'integrations/${Integration}'
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      FunctionName: !ImportValue {Fn::Sub: 'crimrhyth-${env}-ApiFunctionArn'}
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${env}'
    Export: {Name: !Sub 'crimrhyth-${env}-ApiUrl'}
