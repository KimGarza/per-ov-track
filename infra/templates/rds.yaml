AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
  DbClass: {Type: String, Default: db.t4g.micro}
  BackupDays: {Type: Number, Default: 7}
  Protect: {Type: String, Default: 'false', AllowedValues: ['true','false']}
Conditions:
  IsProtected: !Equals [!Ref Protect, 'true']
Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'crimrhyth-${env} database subnets'
      SubnetIds:
        - !ImportValue {Fn::Sub: 'crimrhyth-${env}-SubnetAId'}
        - !ImportValue {Fn::Sub: 'crimrhyth-${env}-SubnetBId'}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'crimrhyth-${env}-db'
      Engine: postgres
      DBInstanceClass: !Ref DbClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups:
        - !ImportValue {Fn::Sub: 'crimrhyth-${env}-DatabaseGroupId'}
      DBName: !Sub 'crimrhyth_${env}'
      MasterUsername: !Sub '{{resolve:secretsmanager:crimrhyth/${env}/database:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:crimrhyth/${env}/database:SecretString:password}}'
      BackupRetentionPeriod: !Ref BackupDays
      DeletionProtection: !If [IsProtected, true, false]
Outputs:
  Endpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: {Name: !Sub 'crimrhyth-${env}-DatabaseEndpoint'}
