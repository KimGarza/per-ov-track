AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  env:
    Type: String
    AllowedValues: [dev, stage, prod]
Resources:
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'crimrhyth-${env}-api-errors'
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 5
      TreatMissingData: notBreaching
      Dimensions: [{Name: FunctionName, Value: !Sub 'crimrhyth-${env}-api-handler'}]
