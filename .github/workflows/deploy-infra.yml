name: Deploy CloudFormation infrastructure

on:
  push:
    branches: [dev, stage, main]
    paths:
      - 'infra/**'
      - 'scripts/infra/prepare-parameters.py'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crimrhyth-infra-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON('{"dev":["dev"],"stage":["stage"],"main":["prod"]}')[github.ref_name] }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ matrix.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "::error::Set AWS_REGION in the GitHub environment"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "::error::Set AWS_ROLE_ARN in the GitHub environment"; exit 1; }
          python scripts/infra/prepare-parameters.py --environment "$DEPLOY_ENV" --output "$RUNNER_TEMP/parameters.json"
      - name: Assume existing AWS deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: crimrhyth-infra-${{ github.run_id }}
      - name: Verify assumed identity
        run: aws sts get-caller-identity
      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail
          for template in infra/templates/*.yaml; do
            aws cloudformation validate-template --template-body "file://$template" >/dev/null
          done
      - name: Deploy ordered infrastructure stacks
        shell: bash
        run: |
          set -euo pipefail
          stacks=(network security secrets rds cognito-base ses lambda routing cognito-finalize monitoring)
          for stack in "${stacks[@]}"; do
            stack_name="crimrhyth-${DEPLOY_ENV}-${stack}"
            mapfile -t params < <(jq -r --arg stack "$stack" '.[$stack][] | "\(.ParameterKey)=\(.ParameterValue)"' "$RUNNER_TEMP/parameters.json")
            echo "::group::Deploy $stack_name"
            aws cloudformation deploy \
              --template-file "infra/templates/$stack.yaml" \
              --stack-name "$stack_name" \
              --parameter-overrides "${params[@]}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset
            aws cloudformation describe-stacks --stack-name "$stack_name" --query 'Stacks[0].Outputs' --output json
            echo "::endgroup::"
          done
