name: Deploy to EAS

on:
  push:
    branches: [dev, stage, prod]
    paths:
      - 'src/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'utils/**'
      - 'assets/**'
      - 'data/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
      - 'expo-env.d.ts'
      - '.github/workflows/build-mobile.yml'

permissions:
  contents: read

concurrency:
  group: eas-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # Change this lookup to map branches to GitHub environments.
        environment: ${{ fromJSON('{"dev":["dev"],"stage":["stage"],"prod":["prod"]}')[github.ref_name] }}
    environment: ${{ matrix.environment }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      EAS_PROFILE: ${{ fromJSON('{"dev":"store-development","stage":"store-staging","prod":"production"}')[matrix.environment] }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - name: Check environment configuration
        run: |
          test -n "$EXPO_TOKEN" || { echo "Add EXPO_TOKEN as a GitHub environment secret."; exit 1; }
          test -n "$ASC_APP_ID" || { echo "Add ASC_APP_ID as a GitHub environment variable."; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Connect to Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Retain npm ci: EAS CLI may evaluate project config and Expo plugins on this runner.
      - name: Install app dependencies
        run: npm ci

      - name: Configure Apple submission target
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const appId = process.env.ASC_APP_ID;
          if (!/^\d+$/.test(appId)) throw new Error('ASC_APP_ID must be the numeric Apple app ID.');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const profile = config.submit[process.env.EAS_PROFILE];
          profile.ios = { ...profile.ios, ascAppId: appId };
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Enable debug logging on EAS development submission workers
        if: matrix.environment == 'dev'
        run: |
          npx eas-cli@latest env:set --environment development --name EXPO_DEBUG --value 1 --visibility plaintext --non-interactive

      - name: Queue dev builds and private testing submissions
        if: matrix.environment == 'dev'
        run: npx eas-cli@latest build --platform all --profile "$EAS_PROFILE" --auto-submit-with-profile "$EAS_PROFILE" --non-interactive --no-wait

      - name: Queue stage or prod builds with automatic submission
        if: matrix.environment != 'dev'
        # Preserve existing stage/prod behavior.
        run: npx eas-cli@latest build --platform all --profile "$EAS_PROFILE" --auto-submit --non-interactive --no-wait
