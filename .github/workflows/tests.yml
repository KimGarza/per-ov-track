name: Tests
on:
  pull_request:
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Report build-compatible runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
